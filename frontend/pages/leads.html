<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini CRM — Leads</title>
<link rel="stylesheet" href="../css/styles.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
<link rel="stylesheet" href="../css/leads.css" />
<style>
    /* Modal Styles - Added directly here to ensure it works */
    .modal-backdrop {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    
    .modal-backdrop:not([hidden]) {
        display: flex !important;
    }
    
    .modal {
        background: white;
        border-radius: 12px;
        width: 90%;
        max-width: 800px;
        max-height: 90vh;
        overflow-y: auto;
        padding: 24px;
    }
    
    .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 1px solid #e5e7eb;
    }
    
    .modal-head h3 {
        margin: 0;
    }
    
    .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 16px;
    }
    
    .form-group {
        margin-bottom: 15px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
    }
    
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
    }
    
    .modal-foot {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e5e7eb;
    }
    
    .btn-ghost {
        padding: 8px 16px;
        background: #f3f4f6;
        border: 1px solid #ddd;
        border-radius: 6px;
        cursor: pointer;
    }
    
    .btn-primary {
        padding: 8px 16px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    
    .icon-btn {
        background: none;
        border: none;
        cursor: pointer;
        font-size: 18px;
    }
</style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="logo-dot"></div><span>Mini CRM</span></div>
    <nav class="side-nav">
      <a href="dashboard.html"><span class="ic">▦</span> Dashboard</a>
      <a href="leads.html" class="active"><span class="ic">☷</span> Leads</a>
      <a href="#"><span class="ic">⌬</span> Contacts</a>
      <a href="#"><span class="ic">⎙</span> Deals</a>
      <a href="#"><span class="ic">⚙</span> Settings</a>
    </nav>
    <div class="side-foot">
      <button id="logoutBtn" class="btn btn-ghost btn-block">Sign out</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle">☰</button>
      <h2>Leads</h2>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle">◐</button>
        <div class="avatar">A</div>
      </div>
    </header>

    <section class="toolbar">
      <div class="search">
        <input type="search" id="searchInput" placeholder="Search by name, email, or company…" />
      </div>
      <div class="filters">
        <select id="statusFilter">
          <option value="">All statuses</option>
          <option>New</option><option>Contacted</option><option>Qualified</option>
          <option>Proposal</option><option>Won</option><option>Lost</option>
        </select>
        <button class="btn btn-primary" id="addLeadBtn">+ Add Lead</button>
      </div>
    </section>

    <section class="panel">
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>Name</th><th>Email</th><th>Source</th><th>Status</th>
              <th>Company</th><th>Phone</th><th>Follow-up</th><th></th>
            </tr>
          </thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </div>
      <div class="table-empty" id="emptyState" hidden>No leads match your search.</div>
    </section>
  </main>
</div>

<!-- MODAL - Add Lead Form -->
<div class="modal-backdrop" id="leadModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3 id="modalTitle">Add Lead</h3>
      <button class="icon-btn" id="closeModal">✕</button>
    </div>
    
    <form id="leadForm">
      <input type="hidden" id="leadId" />
      
      <div class="grid-2">
        <div class="form-group">
          <label>First Name *</label>
          <input type="text" id="firstName" required />
        </div>
        <div class="form-group">
          <label>Last Name *</label>
          <input type="text" id="lastName" required />
        </div>
        
        <div class="form-group">
          <label>Email *</label>
          <input type="email" id="leadEmail" required />
        </div>
        <div class="form-group">
          <label>Phone</label>
          <input type="text" id="phone" />
        </div>
        
        <div class="form-group">
          <label>Company</label>
          <input type="text" id="company" />
        </div>
        <div class="form-group">
          <label>Job Title</label>
          <input type="text" id="jobTitle" />
        </div>
        
        <div class="form-group">
          <label>Source</label>
          <select id="source">
            <option>Website</option><option>Referral</option><option>LinkedIn</option>
            <option>Email</option><option>Cold Call</option><option>Event</option><option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option>New</option><option>Contacted</option><option>Qualified</option>
            <option>Proposal</option><option>Won</option><option>Lost</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Industry</label>
          <input type="text" id="industry" />
        </div>
        <div class="form-group">
          <label>Priority</label>
          <select id="priority">
            <option>Low</option><option>Medium</option><option>High</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Deal Value</label>
          <input type="number" id="dealValue" min="0" />
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="location" />
        </div>
        
        <div class="form-group">
          <label>Preferred Channel</label>
          <select id="preferredChannel">
            <option>Email</option><option>Phone</option><option>WhatsApp</option><option>LinkedIn</option>
          </select>
        </div>
        <div class="form-group">
          <label>Follow-up Date</label>
          <input type="date" id="followUpDate" />
        </div>
        
        <div class="form-group">
          <label>Last Contacted</label>
          <input type="date" id="lastContacted" />
        </div>
        <div class="form-group">
          <label>Tags</label>
          <input type="text" id="tags" placeholder="hot, enterprise" />
        </div>
      </div>
      
      <div class="form-group">
        <label>Notes</label>
        <textarea id="notes" rows="3"></textarea>
      </div>
      
      <div class="modal-foot">
        <button type="button" class="btn-ghost" id="cancelModal">Cancel</button>
        <button type="submit" class="btn-primary" id="saveLead">Save Lead</button>
      </div>
    </form>
  </div>
</div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script src="../js/leads.js"></script>

<script>
    // Additional fallback to ensure modal works
    document.addEventListener('DOMContentLoaded', function() {
        console.log("Page loaded, checking for add button...");
        
        const addBtn = document.getElementById('addLeadBtn');
        if (addBtn) {
            console.log("Add button found");
            addBtn.addEventListener('click', function() {
                console.log("Add button clicked - opening modal");
                const modal = document.getElementById('leadModal');
                if (modal) {
                    modal.hidden = false;
                    // Reset form
                    document.getElementById('leadForm').reset();
                    document.getElementById('leadId').value = '';
                    document.getElementById('modalTitle').innerText = 'Add Lead';
                } else {
                    console.error("Modal not found!");
                }
            });
        } else {
            console.error("Add button not found!");
        }
        
        // Cancel button handler
        const cancelBtn = document.getElementById('cancelModal');
        if (cancelBtn) {
            cancelBtn.addEventListener('click', function() {
                const modal = document.getElementById('leadModal');
                if (modal) modal.hidden = true;
            });
        }
        
        // Close button handler
        const closeBtn = document.getElementById('closeModal');
        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                const modal = document.getElementById('leadModal');
                if (modal) modal.hidden = true;
            });
        }
    });
</script>
</body>
</html>
